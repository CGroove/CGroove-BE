# 운영 환경 설정 (반드시 환경 변수 설정 필요)
# 실행: java -jar app.jar --spring.profiles.active=prod

spring:
  jpa:
    hibernate:
      # 운영에서는 스키마 자동 변경 금지. 최초 배포 시에만 update로 오버라이드
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

server:
  port: 8080

# 1 OCPU / 1GB 환경이라 SQL 로깅 데코레이터(p6spy)를 끈다.
# 로컬(application-local.yml)에서는 그대로 동작한다.
decorator:
  datasource:
    enabled: false

jwt:
  secret: ${JWT_SECRET}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://cgroove.vercel.app}

springdoc:
  swagger-ui:
    enabled: false  # 운영에서 Swagger UI 비활성화

logging:
  level:
    root: INFO
    org.hibernate.SQL: warn
    com.example.dance_community: info

file:
  upload:
    base-dir: ${FILE_UPLOAD_BASE_DIR:/home/ubuntu/app/uploads}
    user-dir: users
    club-dir: clubs
    post-dir: posts
    event-dir: events

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus  # info 제외
  endpoint:
    health:
      show-details: never  # 상세 정보 숨김
